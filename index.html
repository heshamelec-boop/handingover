<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>نظام فحص المعدات — إدارة خدمات المحاكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#14293D; --navy-2:#1E3A52; --navy-deep:#0A1621; --brass:#B08D57; --brass-dark:#8F7040; --brass-light:#D9BC85;
    --bg:#F7F7F5; --card:#FFFFFF; --line:#E3E1DB; --ink:#1B1D1F; --ink-soft:#5B6167;
    --ok:#1F9D55; --warn:#C9962B; --bad-orange:#D9711F; --bad-red:#C13B3B; --none:#8A8F94;
    --radius:10px; --shadow:0 1px 2px rgba(20,41,61,.06), 0 1px 0 rgba(20,41,61,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing:antialiased; padding-bottom: env(safe-area-inset-bottom); }
  h1,h2,h3,.display{ font-family:'Noto Kufi Arabic', system-ui, sans-serif; }
  button{ font-family:inherit; } input,select,textarea{ font-family:inherit; }
  svg.ic{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:middle; }

  #app{ max-width:600px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  header.topbar{ position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(20,41,61,.18); }
  header.topbar .back{ background:none;border:none;color:#fff;padding:4px;cursor:pointer; opacity:.9; display:flex; }
  header.topbar h1{ font-size:16.5px; margin:0; font-weight:700; flex:1; }

  main{ flex:1; padding:16px; padding-bottom:96px; }

  nav.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:30; max-width:600px; margin:0 auto; background:#fff; border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav.bottomnav button{ flex:1; background:none; border:none; padding:8px 4px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-soft); font-size:11px; border-radius:8px; }
  nav.bottomnav button.active{ color:var(--navy); font-weight:700; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .muted{ color:var(--ink-soft); } .small{ font-size:12.5px; }

  label.field{ display:block; margin-bottom:14px; }
  label.field .lbl{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--navy); }
  input[type=text], input[type=search], input[type=date], select, textarea{ width:100%; padding:12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; font-size:15px; color:var(--ink); outline:none; }
  textarea{ min-height:80px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(20,41,61,.08); }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 16px; border-radius:8px; border:none; font-size:15px; font-weight:700; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--navy); color:#fff; } .btn-primary:active{ background:var(--navy-2); }
  .btn-brass{ background:linear-gradient(135deg, var(--brass-light), var(--brass) 55%, var(--brass-dark)); color:#241A0B; box-shadow:0 2px 8px rgba(176,141,87,.35); } .btn-brass:active{ background:var(--brass-dark); box-shadow:none; }
  .btn-ghost{ background:#fff; color:var(--navy); border:1.5px solid var(--line); }
  .btn-danger-ghost{ background:#fff; color:var(--bad-red); border:1.5px solid #F0D3D3; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-row{ display:flex; gap:10px; } .btn-row .btn{ width:auto; flex:1; }

  .chip{ display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .status-تعمل{ background:#E7F6ED; color:var(--ok); }
  .status-تعمل-جزئيًا{ background:#FBF2DD; color:var(--warn); }
  .status-تحتاج-صيانة{ background:#FBE6D8; color:var(--bad-orange); }
  .status-متوقفة-عن-العمل{ background:#FAE0E0; color:var(--bad-red); }
  .status-غير-موجودة{ background:#ECEDEE; color:var(--none); }

  .list-row{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); }
  .list-row:last-child{ border-bottom:none; }
  .list-row .main{ flex:1; min-width:0; }
  .list-row .title{ font-weight:700; font-size:14.5px; }
  .list-row .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .list-row.clickable, .main.clickable{ cursor:pointer; }
  .icon-btn{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:#fff; color:var(--navy); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn.danger{ color:var(--bad-red); border-color:#F0D3D3; }

  .stat{ background:var(--card); border:1px solid var(--line); border-top:3px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .stat:active{ transform:scale(.96); box-shadow:0 0 0 2px var(--navy) inset; }
  .stat .num{ font-family:'Noto Kufi Arabic'; font-size:24px; font-weight:800; color:var(--navy); }
  .stat .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

  .section-title{ font-size:14px; font-weight:700; color:var(--navy); margin:22px 0 10px; display:flex; align-items:center; gap:6px; }
  .section-title:first-child{ margin-top:0; }

  .empty{ text-align:center; padding:40px 16px; color:var(--ink-soft); }
  .empty svg{ width:34px;height:34px;opacity:.4;margin-bottom:10px; }

  .toast{ position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:24px; font-size:13.5px; z-index:100; box-shadow:0 4px 14px rgba(0,0,0,.2); max-width:90%; text-align:center; }

/* ============================= ROUTER ============================= */
let __backGuardPushed = false;
let __topOverlayClose = null;
function __ensureBackGuard(){
  if(!__backGuardPushed){
    history.pushState({ appGuard:true }, '', location.href);
    __backGuardPushed = true;
  }
}
function pushOverlayGuard(closeFn){
  history.pushState({ ov:true }, '', location.href);
  __topOverlayClose = closeFn;
}
function requestCloseTop(){ history.back(); }
window.addEventListener('popstate', ()=>{
  if(__topOverlayClose){ const fn = __topOverlayClose; __topOverlayClose = null; fn(); return; }
  __backGuardPushed = false;
  renderHome();
});

function render(view, params={}){
  if(view === 'home'){ __backGuardPushed = false; }
  else { __ensureBackGuard(); }
  S.view = view; S.params = params;
  const app = document.getElementById('app');
  app.classList.remove('login-mode');
  app.innerHTML = "";
  const shell = document.createElement('div');
  shell.innerHTML = `
    <header class="topbar">
      ${params.back ? `<button class="back" id="btn-back">${ic('back',22)}</button>` : ''}
      <h1>${params.title || ''}</h1>
      <button class="icon-btn" id="global-logout" title="تسجيل الخروج" aria-label="تسجيل الخروج">${ic('logout',20)}</button>
    </header>
    <main id="main"></main>
    <nav class="bottomnav">
      <button data-nav="home" class="${view==='home'?'active':''}">${ic('home')}<span>الرئيسية</span></button>
      ${isInspector()?`<button data-nav="inspect" class="${['inspect','newvisit','equipmentForm'].includes(view)?'active':''}">${ic('wrench')}<span>فحص</span></button>`:''}
      <button data-nav="notes" class="${['notes','equipmentDetail'].includes(view)?'active':''}">${ic('note')}<span>الملاحظات</span></button>
      <button data-nav="reports" class="${view==='reports'?'active':''}">${ic('file')}<span>التقارير</span></button>
    </nav>
  `;
  app.appendChild(shell);
  const globalLogout = shell.querySelector('#global-logout'); if(globalLogout) globalLogout.onclick = logout;
  if(params.back) document.getElementById('btn-back').onclick = params.back;
  shell.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      const v = b.dataset.nav;
      if(v==='home') renderHome();
      else if(v==='inspect') renderInspect();
      else if(v==='notes') renderNotes();
      else if(v==='reports') renderReports();
    };
  });
  const main = document.getElementById('main');
  const fns = {
    home:paintHome, inspect:paintInspect, newvisit:paintNewVisit, visit:paintCurrentInspection,
    equipmentForm:paintEquipmentForm, notes:paintNotes, equipmentDetail:paintEquipmentDetail,
    gallery:paintGallery, reports:paintReports, previous:paintPrevious, prevDetail:paintPrevDetail,
  };
  if(fns[view]) fns[view](main, params);
}

function wireFilterBar(main, f, onChange){
  main.querySelectorAll('[data-f]').forEach(el=>{

    };
  });

async function submitForReview(inspectionId){
  if(!isInspector()){toast('إرسال الفحص للمراجعة متاح للقائم بالفحص فقط');return;}
  const {data:visit,error:visitErr}=await sb.from('inspections').select('id,inspector_id,locked,review_status').eq('id',inspectionId).single();
  if(visitErr||!visit){toast('تعذر التحقق من حالة الفحص');return;}
  const {data:{user:authUser}}=await sb.auth.getUser();
  if(visit.inspector_id!==authUser?.id||visit.locked||!['قيد الفحص','معاد للاستكمال'].includes(visit.review_status||'قيد الفحص')){toast('لا يمكن إرسال هذا الفحص للمراجعة في حالته الحالية');return;}
  const {data:sysRows,error:sysErr}=await sb.from('inspection_systems').select('status').eq('inspection_id',inspectionId);
  if(sysErr){toast('تعذر التحقق من اكتمال الأنظمة');return;}
  const incomplete=(sysRows||[]).filter(x=>x.status!=='مكتمل').length;
  if(incomplete){toast(`لا يمكن الإرسال للمراجعة قبل اكتمال جميع الأنظمة. المتبقي: ${incomplete}`);return;}
  if(!confirm('إرسال الفحص للمدير للمراجعة؟ سيُطلب توقيع القائم بالفحص ثم يتوقف التعديل لحين المراجعة.')) return;
  openSignaturePad(inspectionId, async(signaturePath)=>{
    const now=new Date().toISOString(); const {data:{user}}=await sb.auth.getUser();
    const {error}=await sb.from('inspections').update({review_status:'بانتظار المراجعة',submitted_for_review_at:now,submitted_for_review_by:user?.id||null,inspector_signature_path:signaturePath,inspector_signed_at:now}).eq('id',inspectionId);
    if(error){toast('تعذر إرسال الفحص للمراجعة');return;}
    await sb.from('inspection_review_history').insert({inspection_id:inspectionId,action:'إرسال للمراجعة',action_by:user?.id||null});
    toast('تم توقيع الفحص وإرساله للمراجعة'); await openVisit(inspectionId);
  }, {title:'توقيع القائم بالفحص',hint:'توقيع طلال قبل إرسال الفحص للمراجعة',confirmText:'اعتماد التوقيع وإرسال الفحص',confirmMessage:'هل أنت متأكد من اعتماد التوقيع وإرسال الفحص للمراجعة؟'});
}

let capturingLock = false;
function triggerCameraCapture(main){
  if(capturingLock) return;
  capturingLock = true;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment'; input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', (e)=>{
    try{ handlePhotoCapture(e, main); }
    catch(err){ console.error(err); toast('تعذر فتح الصورة، حاول مرة أخرى'); }
    finally{ input.remove(); capturingLock = false; }
  }, { once:true });
  window.addEventListener('focus', function releaseLock(){ setTimeout(()=>{ capturingLock=false; if(input.isConnected) input.remove(); }, 500); window.removeEventListener('focus', releaseLock); }, { once:true });
  input.click();
}
function handlePhotoCapture(e, main){
  const file = e.target.files[0]; if(!file) return;
  const img = new Image(); const reader = new FileReader();
  reader.onerror = ()=> toast('تعذر قراءة الصورة');
  img.onerror = ()=> toast('تعذر تحميل الصورة');
  reader.onload = (ev)=>{ img.onload = ()=> showCapturePreview(img, file, main); img.src = ev.target.result; };
  reader.readAsDataURL(file);
}
const MAX_PHOTO_DIM = 1440; // long edge, px — keeps stamped text and equipment detail legible while cutting file size drastically
function buildStampCanvas(img){
  let w = img.width, h = img.height;
  const longEdge = Math.max(w, h);
  if(longEdge > MAX_PHOTO_DIM){ const scale = MAX_PHOTO_DIM / longEdge; w = Math.round(w*scale); h = Math.round(h*scale); }
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const v = S.currentVisit;
  const floor = document.getElementById('ef-floor')?.value || '';
  const sysSel = document.getElementById('ef-system');
  const sysName = sysSel && sysSel.selectedIndex>0 ? sysSel.options[sysSel.selectedIndex].text : '';
  const eqName = document.getElementById('ef-name')?.value || '';
  const staSel = document.getElementById('ef-status');
  const staName = staSel ? staSel.options[staSel.selectedIndex].text : '';
  const obsCat = document.getElementById('ef-observation-category')?.value || '';
  const notes = document.getElementById('ef-notes')?.value || '';
  const now = fmtDateTime(new Date().toISOString());
  const lines = [ v.building?.name||'', [floor&&`الدور: ${floor}`, sysName&&`النظام: ${sysName}`].filter(Boolean).join('  —  '), eqName&&`المعدة: ${eqName}`, staName&&`الحالة: ${staName}`, obsCat&&`تصنيف الملاحظة: ${obsCat}`, notes&&`الملاحظة: ${notes.slice(0,60)}`, now ].filter(Boolean);
  const fontSize = Math.max(14, Math.round(canvas.width/38)); const lineH = fontSize*1.45; const padding = fontSize;
  const boxH = lines.length*lineH + padding*1.6;
  ctx.fillStyle = 'rgba(10,16,22,0.68)'; ctx.fillRect(0, canvas.height-boxH, canvas.width, boxH);
  ctx.font = `700 ${fontSize}px 'IBM Plex Sans Arabic', sans-serif`; ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.direction='rtl';
  let y = canvas.height - boxH + padding + fontSize*0.9;
  lines.forEach(line=>{ ctx.fillText(line, canvas.width - padding, y); y += lineH; });
  return canvas;
}
function showCapturePreview(img, originalFile, main){
  const canvas = buildStampCanvas(img);
  const overlay = document.createElement('div'); overlay.className = 'capture-preview';
  const previewImg = document.createElement('img'); previewImg.src = canvas.toDataURL('image/jpeg', 0.75);
  overlay.appendChild(previewImg);
  const actions = document.createElement('div'); actions.className = 'actions';
  actions.innerHTML = `<button class="btn btn-ghost" id="retake">إعادة التصوير</button><button class="btn btn-brass" id="accept">اعتماد الصورة</button>`;
  overlay.appendChild(actions); document.body.appendChild(overlay);
  pushOverlayGuard(()=> overlay.remove());
  overlay.querySelector('#retake').onclick = ()=> requestCloseTop();
  overlay.querySelector('#accept').onclick = ()=>{
    canvas.toBlob((stampedBlob)=>{
      const id = uid();
      S.pendingPhotos.push({ id, stampedBlob, previewUrl: previewImg.src });
      addPhotoThumb(main, id, previewImg.src);
      requestCloseTop();
    }, 'image/jpeg', 0.72);
  };
}
function addPhotoThumb(main, id, src){
  const grid = main.querySelector('#photo-grid');
  const div = document.createElement('div'); div.className='photo-thumb'; div.dataset.pending=id;
  div.innerHTML = `<img src="${src}"><button class="rm" type="button">×</button>`;
  div.querySelector('.rm').onclick = ()=>{ S.pendingPhotos = S.pendingPhotos.filter(p=>p.id!==id); div.remove(); };
  grid.insertBefore(div, grid.firstChild);
}

/* ============================= FULLSCREEN PHOTO VIEWER ============================= */
function openPhotoViewer(items, startIndex, infoHtml){
  let idx = startIndex;
  const overlay = document.createElement('div'); overlay.className = 'viewer';
  function draw(){
    overlay.innerHTML = `
      <div class="vtop"><button id="v-close">${ic('x',18)}</button><div class="small">${idx+1} / ${items.length}</div><div style="width:36px"></div></div>
      <div class="vimg-wrap">
        ${items.length>1 ? `<button class="nav-btn nav-prev" id="v-prev">${ic('chevR',20)}</button>` : ''}
        <img src="${items[idx].url}">
        ${items.length>1 ? `<button class="nav-btn nav-next" id="v-next">${ic('chevL',20)}</button>` : ''}
      </div>
      ${infoHtml ? `<div class="vinfo">${infoHtml(items[idx])}</div>` : ''}
    `;
    overlay.querySelector('#v-close').onclick = ()=> requestCloseTop();
    const prev = overlay.querySelector('#v-prev'), next = overlay.querySelector('#v-next');
    if(prev) prev.onclick = ()=>{ idx = (idx-1+items.length)%items.length; draw(); };
    if(next) next.onclick = ()=>{ idx = (idx+1)%items.length; draw(); };
  }
  draw();
  document.body.appendChild(overlay);
  pushOverlayGuard(()=> overlay.remove());
}

async function openSignaturePad(inspectionId, onDone, options={}){
  const overlay = document.createElement('div'); overlay.className = 'sigpad-wrap';
  overlay.innerHTML = `
    <div class="sig-head"><h3>${escHtml(options.title||'التوقيع')}</h3><div class="small" style="opacity:.8">${escHtml(options.hint||'وقّع في المساحة أدناه')}</div></div>
    <canvas id="sig-canvas"></canvas>
    <div class="sig-line"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="sig-cancel">إلغاء</button>
      <button class="btn btn-ghost" id="sig-clear">مسح</button>
      <button class="btn btn-brass" id="sig-confirm">${escHtml(options.confirmText||'اعتماد التوقيع')}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayGuard(()=> overlay.remove());
  overlay.querySelector('#sig-cancel').onclick = ()=> requestCloseTop();

  const canvas = overlay.querySelector('#sig-canvas');
  const dpr = window.devicePixelRatio || 1;
  function sizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14293D';
  }
  requestAnimationFrame(sizeCanvas);
  const ctx = canvas.getContext('2d');
  let drawing = false, hasSignature = false, lastX=0, lastY=0;
  function pos(e){ const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x:t.clientX-r.left, y:t.clientY-r.top }; }
  function start(e){ e.preventDefault(); drawing = true; hasSignature = true; const p = pos(e); lastX=p.x; lastY=p.y; }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
  function end(){ drawing = false; }
  canvas.addEventListener('pointerdown', start); canvas.addEventListener('pointermove', move); window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, { passive:false }); canvas.addEventListener('touchmove', move, { passive:false }); canvas.addEventListener('touchend', end);

  overlay.querySelector('#sig-clear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature = false; };
  overlay.querySelector('#sig-confirm').onclick = async ()=>{
    if(!hasSignature){ toast('يرجى التوقيع أولًا قبل الاعتماد'); return; }
    if(!confirm(options.confirmMessage||'هل أنت متأكد من اعتماد التوقيع؟')) return;
    const confirmBtn = overlay.querySelector('#sig-confirm'); confirmBtn.disabled = true; confirmBtn.innerHTML = '<span class="spinner"></span>';
    canvas.toBlob(async (blob)=>{
      const path = `signatures/${inspectionId}_${options.title?.includes('مدير')?'approver':'inspector'}_${uid()}.png`;
      const {error:uploadError} = await sb.storage.from('inspection-photos').upload(path, blob, { contentType:'image/png' });
      if(uploadError){ confirmBtn.disabled=false; confirmBtn.textContent=options.confirmText||'اعتماد التوقيع'; toast('تعذر حفظ التوقيع، يرجى المحاولة مرة أخرى'); return; }
      requestCloseTop();
      await onDone(path);
    }, 'image/png');
  };
}

async function showSystemsStatusReport(filters){
  const overlay=document.createElement('div'); overlay.id='report-overlay';

  let iq=sb.from('inspections').select('id,building_id,contract_id,visit_started_at,visit_completed_at,status,inspector_signature_path,approver_signature_path,review_status,submitted_for_review_at,submitted_for_review_by,returned_for_completion_at,returned_for_completion_by,return_reason,building:buildings!inner(id,name,governorate_id,governorate:governorates(name)),contract:contracts(contract_number,contractor_name,description)').order('visit_started_at',{ascending:false});
  if(filters.inspection_id) iq=iq.eq('id',filters.inspection_id);
  if(filters.building_id) iq=iq.eq('building_id',filters.building_id);

  if(filters.date_to) iq=iq.lte('visit_started_at',filters.date_to+'T23:59:59');
  const {data:inspections,error:ie}=await iq;
  if(ie){overlay.innerHTML=`<div class="report-toolbar"><button class="btn btn-ghost" id="report-close">إغلاق</button></div>`+errorBox(ie);overlay.querySelector('#report-close').onclick=()=>requestCloseTop();return;}

  const ids=ins.map(x=>x.id);
  let systemRows=[]; let equipment=[];
  if(ids.length){
    const [{data:sr,error:se},{data:eq,error:ee}]=await Promise.all([
      sb.from('inspection_systems').select('inspection_id,system_id,status,system:systems(name,sort_order)').in('inspection_id',ids),
      sb.from('equipment_inspections').select('id,inspection_id,system_id,observations,status:operational_statuses(name)').in('inspection_id',ids)

  if(filters.status_id){const wanted=S.statuses.find(x=>x.id===filters.status_id)?.name; equipment=equipment.filter(x=>x.status?.name===wanted);}

  const body=reportRows.length?reportRows.map((r,i)=>`<tr><td>${i+1}</td><td>${escHtml(r.inspection?.building?.governorate?.name||'')}</td><td>${escHtml(r.inspection?.building?.name||'')}</td><td>${escHtml(r.sr.system?.name||'')}</td><td>${escHtml(r.sr.status||'')}</td><td>${r.total}</td>${S.statuses.map(st=>`<td>${r.counts[st.name]||0}</td>`).join('')}<td>${r.notes}</td></tr>`).join(''):`<tr><td colspan="${7+S.statuses.length}" style="text-align:center;color:#888">لا توجد بيانات مطابقة</td></tr>`;

  overlay.querySelector('#report-close').onclick=()=>requestCloseTop(); overlay.querySelector('#report-print').onclick=()=>window.print();

/* ============================= REPORT ENGINE ============================= */
async function showReport(filters, withPhotos, titleLabel){
  const overlay = document.createElement('div'); overlay.id='report-overlay';
  overlay.innerHTML = `<div class="report-toolbar"><button class="btn btn-ghost" id="report-close">إغلاق</button><span class="row" style="color:#fff"><span class="spinner"></span> جارٍ إعداد التقرير…</span></div>`;
  document.body.appendChild(overlay);
  pushOverlayGuard(()=> overlay.remove());
  overlay.querySelector('#report-close').onclick = ()=> requestCloseTop();

  let q = sb.from('equipment_inspections')
    .select('id, floor, equipment_name, equipment_code, observation_category, observations, created_at, system:systems(name), status:operational_statuses(name), inspection:inspections!inner(id, building_id, contract_id, visit_started_at, visit_completed_at, status, building:buildings!inner(id, name, governorate_id, governorate:governorates(name)), contract:contracts(contract_number,contractor_name,description))')
    .order('created_at');
  if(filters.inspection_id) q = q.eq('inspection_id', filters.inspection_id);
  if(filters.system_id) q = q.eq('system_id', filters.system_id);
  if(filters.status_id) q = q.eq('operational_status_id', filters.status_id);
  if(filters.date_from) q = q.gte('created_at', filters.date_from);
  if(filters.date_to) q = q.lte('created_at', filters.date_to+'T23:59:59');
  const { data, error } = await q;
  if(error){ overlay.innerHTML = `<div class="report-toolbar"><button class="btn btn-ghost" id="report-close">إغلاق</button></div>` + errorBox(error); overlay.querySelector('#report-close').onclick=()=>requestCloseTop(); return; }
  let rows = data;
  if(filters.governorate_id) rows = rows.filter(r=>r.inspection?.building?.governorate_id===filters.governorate_id);
  if(filters.building_id) rows = rows.filter(r=>r.inspection?.building_id===filters.building_id);
  rows.sort((a,b)=>{
    const sn=(a.system?.name||'').localeCompare(b.system?.name||'','ar'); if(sn) return sn;
    const fl=(a.floor||'').localeCompare(b.floor||'','ar',{numeric:true}); if(fl) return fl;
    return (a.equipment_name||'').localeCompare(b.equipment_name||'','ar',{numeric:true});
  });

  const summary = {}; S.statuses.forEach(s=> summary[s.name]=0 );
  rows.forEach(r=>{ if(r.status?.name!=null) summary[r.status.name] = (summary[r.status.name]||0)+1; });

  let photosByEquip = {};
  if(withPhotos && rows.length){
    const { data:photos } = await sb.from('inspection_photos').select('equipment_inspection_id, stamped_path, original_path').in('equipment_inspection_id', rows.map(r=>r.id));
    for(const p of (photos||[])){
      const path = p.stamped_path || p.original_path;
      const { data:signed } = await sb.storage.from('inspection-photos').createSignedUrl(path, 3600);
      if(signed?.signedUrl) (photosByEquip[p.equipment_inspection_id] ||= []).push(signed.signedUrl);
    }
  }

  let signatureUrl = null, approverSignatureUrl = null, inspectionDetail = null, systemProgress = [], inspectorName = '—', approverName = '—';
  if(filters.inspection_id){
    const { data:insp } = await sb.from('inspections').select('id,contract_id,inspector_id,approved_by,approved_at,approver_signature_path,inspector_signed_at,approver_signed_at,visit_started_at,visit_completed_at,status,inspector_signature_path,review_status,submitted_for_review_at,submitted_for_review_by,returned_for_completion_at,returned_for_completion_by,return_reason,building:buildings(name,governorate:governorates(name)),contract:contracts(contract_number,contractor_name,description)').eq('id', filters.inspection_id).single();
    inspectionDetail = insp || null;
    if(insp?.inspector_id){ const {data:ip}=await sb.from('profiles').select('full_name').eq('id',insp.inspector_id).maybeSingle(); inspectorName=ip?.full_name||'—'; }
    if(insp?.approved_by){ const {data:ap}=await sb.from('profiles').select('full_name').eq('id',insp.approved_by).maybeSingle(); approverName=ap?.full_name||'م. خالد أحمد الحسن'; }
    if(insp?.inspector_signature_path){
      const { data:signed } = await sb.storage.from('inspection-photos').createSignedUrl(insp.inspector_signature_path, 3600);
      signatureUrl = signed?.signedUrl || null;
    }
    if(insp?.approver_signature_path){
      const { data:signed } = await sb.storage.from('inspection-photos').createSignedUrl(insp.approver_signature_path, 3600);
      approverSignatureUrl = signed?.signedUrl || null;
    }
    const {data:sp}=await sb.from('inspection_systems').select('status,system:systems(name,sort_order)').eq('inspection_id',filters.inspection_id);
    systemProgress=(sp||[]).sort((a,b)=>(a.system?.sort_order||0)-(b.system?.sort_order||0));
  }
  const observationsRows = rows.filter(r=>(r.observations||'').trim());

  const selectedGov = filters.governorate_id ? S.governorates.find(g=>g.id===filters.governorate_id)?.name : null;
  const selectedBuilding = filters.building_id ? S.buildings.find(b=>b.id===filters.building_id)?.name : null;
  const selectedSystem = filters.system_id ? S.systems.find(s=>s.id===filters.system_id)?.name : null;
  const selectedStatus = filters.status_id ? S.statuses.find(s=>s.id===filters.status_id)?.name : null;
  const formalFilterMeta = !inspectionDetail ? [
    selectedGov ? `<div><b>المحافظة:</b> ${escHtml(selectedGov)}</div>` : '',
    selectedBuilding ? `<div><b>المبنى:</b> ${escHtml(selectedBuilding)}</div>` : '',
    selectedSystem ? `<div><b>النظام:</b> ${escHtml(selectedSystem)}</div>` : '',
    selectedStatus ? `<div><b>الحالة التشغيلية:</b> ${escHtml(selectedStatus)}</div>` : '',
    filters.date_from ? `<div><b>من تاريخ:</b> ${escHtml(filters.date_from)}</div>` : '',
    filters.date_to ? `<div><b>إلى تاريخ:</b> ${escHtml(filters.date_to)}</div>` : '',
  ].join('') : '';

  overlay.innerHTML = `
    <div class="report-toolbar">
      <button class="btn btn-ghost" id="report-close">إغلاق</button>
      <button class="btn btn-brass" id="report-print">${ic('print',18)} طباعة / حفظ PDF</button>
    </div>
    <div id="report-page">
      <h2>${titleLabel}</h2>
      <div class="small" style="color:#666">وزارة العدل — إدارة خدمات المحاكم</div>
      <div class="report-meta">
        ${inspectionDetail?.contract ? `<div><b>رقم العقد:</b> ${escHtml(inspectionDetail.contract.contract_number||'—')}</div><div><b>المتعهد:</b> ${escHtml(inspectionDetail.contract.contractor_name||'—')}</div><div style="grid-column:1/-1"><b>موضوع العقد:</b> ${escHtml(inspectionDetail.contract.description||'—')}</div>` : ''}
        ${inspectionDetail?.building ? `<div><b>المحافظة:</b> ${escHtml(inspectionDetail.building.governorate?.name||'—')}</div><div><b>المبنى:</b> ${escHtml(inspectionDetail.building.name||'—')}</div>` : formalFilterMeta}
        ${inspectionDetail ? `<div><b>القائم بالفحص:</b> ${escHtml(inspectorName)}</div><div><b>حالة التقرير:</b> ${inspectionDetail.review_status==='معتمد ومغلق'?'معتمد ومغلق':'غير معتمد نهائيًا'}</div><div><b>بدء الفحص:</b> ${fmtDateTime(inspectionDetail.visit_started_at)}</div><div><b>انتهاء الفحص:</b> ${inspectionDetail.visit_completed_at?fmtDateTime(inspectionDetail.visit_completed_at):'لم يعتمد بعد'}</div>${inspectionDetail.approved_at?`<div><b>تاريخ الاعتماد:</b> ${fmtDateTime(inspectionDetail.approved_at)}</div><div><b>المعتمد:</b> ${escHtml(approverName)} — مدير إدارة خدمات المحاكم</div>`:''}` : ''}
        <div><b>عدد المعدات المفحوصة:</b> ${rows.length}</div>
        <div><b>تاريخ إصدار التقرير:</b> ${fmtDateTime(new Date().toISOString())}</div>
      </div>
      <div class="report-summary">
        <div><b>${rows.length}</b>الإجمالي</div>
        ${S.statuses.map(s=>`<div><b style="color:${statusColor(s.name)}">${summary[s.name]||0}</b>${s.name}</div>`).join('')}
      </div>
      ${systemProgress.length?`<h3 style="font-family:'Noto Kufi Arabic';font-size:14px">حالة استكمال فحص الأنظمة</h3><div class="report-table-wrap"><table class="report-table"><thead><tr><th>النظام</th><th>حالة الفحص</th></tr></thead><tbody>${systemProgress.map(x=>`<tr><td>${escHtml(x.system?.name||'')}</td><td>${escHtml(x.status)}</td></tr>`).join('')}</tbody></table></div><br>`:''}
      <h3 style="font-family:'Noto Kufi Arabic';font-size:14px">تفاصيل المعدات والحالة الفنية</h3>
      <div class="report-table-wrap"><table class="report-table">
        <thead><tr><th style="width:26px">م</th><th>المحافظة</th><th>المبنى</th><th>اسم المعدة</th><th>الكود</th><th>الدور</th><th>النظام</th><th>الحالة</th><th>تصنيف الملاحظة</th><th>الملاحظات</th><th>التاريخ</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((r,i)=>`
            <tr>
              <td>${i+1}</td><td>${escHtml(r.inspection?.building?.governorate?.name||'')}</td><td>${escHtml(r.inspection?.building?.name||'')}</td>
              <td>${escHtml(r.equipment_name)}</td><td>${escHtml(r.equipment_code||'—')}</td><td>${escHtml(r.floor||'—')}</td>
              <td>${escHtml(r.system?.name||'')}</td><td>${escHtml(r.status?.name||'')}</td><td>${escHtml(r.observation_category||'—')}</td><td>${escHtml(r.observations||'—')}</td><td>${fmtDate(r.created_at)}</td>
            </tr>
          `).join('') : `<tr><td colspan="11" style="text-align:center; color:#888">لا توجد بيانات مسجلة</td></tr>`}
        </tbody>
      </table></div>
      <div style="margin-top:24px">
        <h3 style="font-family:'Noto Kufi Arabic';font-size:14px">ملخص الملاحظات المرصودة</h3>
        ${observationsRows.length?`<div class="report-table-wrap"><table class="report-table"><thead><tr><th>م</th><th>النظام</th><th>الدور</th><th>المعدة</th><th>الحالة</th><th>التصنيف</th><th>الملاحظة</th></tr></thead><tbody>${observationsRows.map((r,i)=>`<tr><td>${i+1}</td><td>${escHtml(r.system?.name||'')}</td><td>${escHtml(r.floor||'—')}</td><td>${escHtml(r.equipment_name||'')}</td><td>${escHtml(r.status?.name||'')}</td><td>${escHtml(r.observation_category||'—')}</td><td>${escHtml(r.observations||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small muted">لا توجد ملاحظات مرصودة.</div>'}
      </div>
      ${withPhotos ? `
      <div class="report-appendix">
        <h3>ملحق الصور</h3>
        ${rows.filter(r=>photosByEquip[r.id]?.length).map(r=>`
          <div class="appendix-item">
            <div class="meta-line"><b>${escHtml(r.inspection?.building?.name||'')}</b> — ${escHtml(r.equipment_name)} ${r.equipment_code?'('+escHtml(r.equipment_code)+')':''}</div>
            <div class="meta-line">الدور: ${escHtml(r.floor||'—')} · النظام: ${escHtml(r.system?.name||'')} · الحالة: ${escHtml(r.status?.name||'')}</div>
            ${r.observations ? `<div class="meta-line">الملاحظة: ${escHtml(r.observations)}</div>` : ''}
            <div class="imgs">${photosByEquip[r.id].map(u=>`<img src="${u}">`).join('')}</div>
          </div>
        `).join('') || `<div class="small muted">لا توجد صور مرفقة بالمعدات المسجلة</div>`}
      </div>` : ''}
      <div class="report-footer" style="align-items:flex-end; justify-content:space-between">
        ${signatureUrl ? `<div><img src="${signatureUrl}" style="height:60px; display:block; margin-bottom:4px">
          <div>توقيع القائم بالفحص (معتمد رقميًا)</div></div>` : '<div></div>'}
        <div style="text-align:center;min-width:220px">${inspectionDetail?.approved_at?`${approverSignatureUrl?`<img src="${approverSignatureUrl}" style="height:60px;display:block;margin:0 auto 4px">`:''}<div style="font-weight:700">اعتماد مدير إدارة خدمات المحاكم</div><div>${escHtml(approverName)}</div><div class="small">${fmtDateTime(inspectionDetail.approved_at)}</div>`:'<div>اعتماد مدير إدارة خدمات المحاكم: _____________________</div>'}</div>
      </div>
    </div>
  `;
  overlay.querySelector('#report-close').onclick = ()=> requestCloseTop();
  overlay.querySelector('#report-print').onclick = ()=> window.print();
}


async function showCloseoutCenter(){
  if(!isManager()){ toast('هذه الشاشة متاحة لمدير إدارة خدمات المحاكم'); return; }
  const overlay=document.createElement('div'); overlay.id='report-overlay'; document.body.appendChild(overlay);
  overlay.innerHTML=`<div class="report-toolbar"><button class="btn btn-ghost" id="closeouts-close">إغلاق</button></div><div id="report-page"><div class="row"><span class="spinner dark"></span><span class="muted small">جارٍ تحميل محاضر الاستلام…</span></div></div>`;
  overlay.querySelector('#closeouts-close').onclick=()=>requestCloseTop();
  const {data:rows,error}=await sb.from('inspections')
    .select('id,review_status,locked,approved_at,visit_started_at,building:buildings(name,governorate:governorates(name)),contract:contracts(contract_number)')
    .order('visit_started_at',{ascending:false});
  const page=overlay.querySelector('#report-page');
  if(error){ page.innerHTML=errorBox(error); return; }
  const list=rows||[];
  page.innerHTML=`
    <div style="text-align:center;border-bottom:2px solid #14293D;padding-bottom:12px;margin-bottom:18px">
      <div style="font-weight:700">وزارة العدل</div><div>إدارة خدمات المحاكم</div>
      <h2 style="margin-top:10px">محاضر الاستلام</h2>
      <div class="small muted">متابعة محاضر إقفال الفحص والاستلام للمباني</div>
    </div>
    <div class="card" style="padding:4px 12px">
      ${list.length?list.map(v=>{
        const approved=v.locked&&v.review_status==='معتمد ومغلق';
        return `<div class="list-row" style="align-items:center">
          <div class="main"><div class="title">${escHtml(v.building?.name||'')}</div>
          <div class="sub">${escHtml(v.building?.governorate?.name||'')} · العقد ${escHtml(v.contract?.contract_number||'—')}</div>
          <div class="small muted">${approved?'اعتمد: '+fmtDateTime(v.approved_at):'حالة الفحص: '+escHtml(v.review_status||'قيد الفحص')}</div></div>
          ${approved?`<button class="btn btn-brass" data-closeout-id="${v.id}" style="width:auto;padding:9px 12px">عرض محضر الاستلام</button>`:`<span class="chip">لم يعتمد بعد</span>`}
        </div>`;
      }).join(''):'<div class="empty">لا توجد عمليات فحص مسجلة</div>'}
    </div>`;
  page.querySelectorAll('[data-closeout-id]').forEach(btn=>btn.onclick=()=>{ overlay.remove(); showCloseoutReport(btn.dataset.closeoutId); });
}

async function showCloseoutReport(inspectionId){
  const overlay=document.createElement('div'); overlay.id='report-overlay'; document.body.appendChild(overlay);
  overlay.innerHTML=`<div class="report-toolbar"><button class="btn btn-ghost" id="report-close">إغلاق</button></div><div id="report-page"><div class="row"><span class="spinner dark"></span></div></div>`;
  overlay.querySelector('#report-close').onclick=()=>requestCloseTop();
  const {data:insp,error}=await sb.from('inspections').select('id,contract_id,inspector_id,approved_by,approved_at,approver_signature_path,inspector_signed_at,approver_signed_at,visit_started_at,visit_completed_at,locked,review_status,building:buildings(name,governorate:governorates(name)),contract:contracts(contract_number,contractor_name,description)').eq('id',inspectionId).single();
  if(error||!insp){overlay.querySelector('#report-page').innerHTML=errorBox(error||{message:'تعذر تحميل بيانات الفحص'});return;}
  if(!insp.locked||insp.review_status!=='معتمد ومغلق'){overlay.querySelector('#report-page').innerHTML='<div class="empty"><div>محضر الإقفال متاح بعد اعتماد وإغلاق الفحص فقط.</div></div>';return;}
  const [{data:systems},{data:eq},{data:inspector},{data:approver}]=await Promise.all([
    sb.from('inspection_systems').select('status,system:systems(name,sort_order)').eq('inspection_id',inspectionId),
    sb.from('equipment_inspections').select('id,observations,observation_category,status:operational_statuses(name)').eq('inspection_id',inspectionId),
    sb.from('profiles').select('full_name').eq('id',insp.inspector_id).maybeSingle(),
    sb.from('profiles').select('full_name').eq('id',insp.approved_by).maybeSingle()
  ]);
  const systemRows=(systems||[]).sort((a,b)=>(a.system?.sort_order||0)-(b.system?.sort_order||0));
  const equipment=eq||[]; const notes=equipment.filter(x=>(x.observations||'').trim());
  const statusCounts={}; equipment.forEach(x=>{const n=x.status?.name||'غير محدد';statusCounts[n]=(statusCounts[n]||0)+1;});
  const catCounts={}; notes.forEach(x=>{const n=x.observation_category||'غير مصنف';catCounts[n]=(catCounts[n]||0)+1;});
  const completed=systemRows.filter(x=>x.status==='مكتمل').length;
  const inspectorName=inspector?.full_name||'طلال الدعيج'; const approverName=approver?.full_name||'م. خالد أحمد الحسن';
  overlay.innerHTML=`
    <div class="report-toolbar"><button class="btn btn-ghost" id="report-close">إغلاق</button><button class="btn btn-brass" id="report-print">${ic('print',18)} طباعة / حفظ PDF</button></div>
    <div id="report-page">
      <div style="text-align:center;border-bottom:2px solid #14293D;padding-bottom:12px;margin-bottom:18px"><div style="font-weight:700">وزارة العدل</div><div>إدارة خدمات المحاكم</div><h2 style="margin-top:10px">محضر إقفال الفحص والاستلام للمبنى</h2></div>
      <div class="report-meta">
        <div><b>رقم العقد:</b> ${escHtml(insp.contract?.contract_number||'—')}</div><div><b>المتعهد:</b> ${escHtml(insp.contract?.contractor_name||'—')}</div>
        <div style="grid-column:1/-1"><b>موضوع العقد:</b> ${escHtml(insp.contract?.description||'—')}</div>
        <div><b>المحافظة:</b> ${escHtml(insp.building?.governorate?.name||'—')}</div><div><b>المبنى:</b> ${escHtml(insp.building?.name||'—')}</div>
        <div><b>بدء الفحص:</b> ${fmtDateTime(insp.visit_started_at)}</div><div><b>انتهاء الفحص:</b> ${fmtDateTime(insp.visit_completed_at||insp.approved_at)}</div>
        <div><b>القائم بالفحص:</b> ${escHtml(inspectorName)}</div><div><b>تاريخ الاعتماد:</b> ${fmtDateTime(insp.approved_at)}</div>
      </div>
      <div class="report-summary"><div><b>${systemRows.length}</b>إجمالي الأنظمة</div><div><b>${completed}</b>أنظمة مكتملة</div><div><b>${equipment.length}</b>معدة مفحوصة</div><div><b>${notes.length}</b>ملاحظة مرصودة</div></div>
      <h3 style="font-family:'Noto Kufi Arabic';font-size:14px">حالة فحص الأنظمة</h3>
      <div class="report-table-wrap"><table class="report-table"><thead><tr><th>م</th><th>النظام</th><th>حالة الفحص</th></tr></thead><tbody>${systemRows.map((x,i)=>`<tr><td>${i+1}</td><td>${escHtml(x.system?.name||'')}</td><td>${escHtml(x.status||'')}</td></tr>`).join('')}</tbody></table></div>
      <h3 style="font-family:'Noto Kufi Arabic';font-size:14px;margin-top:20px">ملخص الحالة التشغيلية للمعدات</h3>
      <div class="report-table-wrap"><table class="report-table"><thead><tr><th>الحالة التشغيلية</th><th>العدد</th></tr></thead><tbody>${Object.entries(statusCounts).map(([k,v])=>`<tr><td>${escHtml(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2">لا توجد معدات مسجلة</td></tr>'}</tbody></table></div>
      <h3 style="font-family:'Noto Kufi Arabic';font-size:14px;margin-top:20px">ملخص الملاحظات حسب التصنيف</h3>
      <div class="report-table-wrap"><table class="report-table"><thead><tr><th>تصنيف الملاحظة</th><th>العدد</th></tr></thead><tbody>${Object.entries(catCounts).map(([k,v])=>`<tr><td>${escHtml(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2">لا توجد ملاحظات مرصودة</td></tr>'}</tbody></table></div>
      <div style="margin-top:24px;border:1px solid #bbb;border-radius:6px;padding:14px;line-height:2"><b>إثبات حالة الفحص:</b><br>تم إقفال أعمال الفحص لهذا المبنى بعد تسجيل حالة الأنظمة والمعدات والملاحظات المرصودة وفق المعاينة المنفذة خلال فترة الفحص. وتمثل البيانات والملاحظات المثبتة بالنظام الحالة التي تمت معاينتها وتوثيقها وقت الفحص، وتُقرأ مع تقرير الاستلام الفني وكشف الملاحظات وملحق الصور المرتبطين بهذه العملية.</div>
      <div class="report-footer" style="margin-top:38px;justify-content:space-between;align-items:flex-start"><div style="text-align:center;min-width:220px"><b>القائم بالفحص</b><div>${escHtml(inspectorName)}</div><div style="margin-top:28px">التوقيع: __________________</div></div><div style="text-align:center;min-width:260px"><b>اعتماد مدير إدارة خدمات المحاكم</b><div>${escHtml(approverName)}</div><div class="small">${fmtDateTime(insp.approved_at)}</div><div style="margin-top:20px">التوقيع: __________________</div></div></div>
    </div>`;
  overlay.querySelector('#report-close').onclick=()=>requestCloseTop(); overlay.querySelector('#report-print').onclick=()=>window.print();
}

/* ============================= BOOT ============================= */
boot();
</script>
</body>
</html>
